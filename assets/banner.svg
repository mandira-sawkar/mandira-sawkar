  <!-- ===== EDIT COLORS HERE ===== -->
  <style>
    :root { --bg1:#0b1324; --bg2:#12304a; --accent:#2dd4bf; --accent2:#60a5fa; --text:#f1f5f9; --muted:#94a3b8; }
    .bg1{stop-color:var(--bg1)} .bg2{stop-color:var(--bg2)}
    .star{fill:var(--muted);opacity:.25}
    .edge{stroke:var(--accent2);stroke-width:1.3;stroke-opacity:.45;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
    .node{opacity:0;transform:scale(.2);animation:pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
    .core{fill:var(--accent)}
    .halo{fill:var(--accent);opacity:.18;animation:breathe 3.2s ease-in-out 4s infinite}
    .pulse{fill:#ffffff;filter:drop-shadow(0 0 4px var(--accent))}
    .name{font:700 54px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text);opacity:0;animation:fade .9s ease-out .2s forwards}
    .role{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--accent);opacity:0;animation:fade .9s ease-out .7s forwards}
    .tag{font:400 16px 'Fira Code',Consolas,monospace;fill:var(--muted);opacity:0;animation:fade .9s ease-out 1.2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes breathe{0%,100%{opacity:.15}50%{opacity:.4}}
    @media (prefers-reduced-motion: reduce) {
      .edge{animation:none;stroke-dashoffset:0} .node,.name,.role,.tag{animation:none;opacity:1;transform:none} .halo{animation:none} .pulse{display:none}
    }
  </style>

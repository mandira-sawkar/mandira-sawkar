<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Thanks for stopping by.">
  <!-- ===== EDIT COLORS HERE (keep in sync with banner.svg) ===== -->
  <style>
    :root { --bg1:#0b1324; --bg2:#12304a; --accent:#2dd4bf; --accent2:#60a5fa; --text:#f1f5f9; --muted:#94a3b8; }
    .bg1{stop-color:var(--bg1)} .bg2{stop-color:var(--bg2)}
    .star{fill:var(--muted);opacity:.25}
    .edge{stroke:var(--accent2);stroke-width:1.3;stroke-opacity:.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease-out forwards}
    .faint{stroke-opacity:.22}
    .node{opacity:0;transform:scale(.2);animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    .core{fill:var(--accent)}
    .halo{fill:var(--accent);opacity:.18;animation:breathe 3.2s ease-in-out 2.5s infinite}
    .pulse{fill:#ffffff;filter:drop-shadow(0 0 4px var(--accent))}
    .msg{font:600 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--text);opacity:0;animation:fade .9s ease-out .4s forwards}
    .sub{font:400 14px 'Fira Code',Consolas,monospace;fill:var(--accent);opacity:0;animation:fade .9s ease-out .9s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1;transform:scale(1)}}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes breathe{0%,100%{opacity:.15}50%{opacity:.4}}
    @media (prefers-reduced-motion: reduce) {
      .edge{animation:none;stroke-dashoffset:0} .node,.msg,.sub{animation:none;opacity:1;transform:none} .halo{animation:none} .pulse{display:none}
    }
  </style>
  <defs><linearGradient id="g" x1="1" y1="0" x2="0" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient></defs>
  <rect width="1200" height="130" rx="18" fill="url(#g)"/>
  <circle cx="543" cy="73" r="1.4" class="star"/><circle cx="559" cy="66" r="1.1" class="star"/><circle cx="222" cy="67" r="1.2" class="star"/><circle cx="952" cy="12" r="0.9" class="star"/><circle cx="109" cy="105" r="1.2" class="star"/><circle cx="50" cy="128" r="1.5" class="star"/><circle cx="785" cy="80" r="0.7" class="star"/><circle cx="18" cy="69" r="0.7" class="star"/><circle cx="228" cy="31" r="0.6" class="star"/><circle cx="557" cy="57" r="1.4" class="star"/><circle cx="623" cy="83" r="1.0" class="star"/><circle cx="795" cy="59" r="0.9" class="star"/><circle cx="1197" cy="129" r="1.4" class="star"/><circle cx="849" cy="41" r="0.8" class="star"/><circle cx="347" cy="9" r="1.3" class="star"/><circle cx="480" cy="110" r="0.9" class="star"/><circle cx="1150" cy="110" r="0.6" class="star"/><circle cx="252" cy="118" r="1.0" class="star"/><circle cx="1176" cy="52" r="0.7" class="star"/><circle cx="755" cy="101" r="0.8" class="star"/><circle cx="105" cy="43" r="1.5" class="star"/><circle cx="910" cy="15" r="0.8" class="star"/><circle cx="121" cy="8" r="1.3" class="star"/><circle cx="213" cy="73" r="1.0" class="star"/><circle cx="229" cy="95" r="0.7" class="star"/><circle cx="772" cy="15" r="1.0" class="star"/><circle cx="255" cy="35" r="1.5" class="star"/><circle cx="964" cy="40" r="1.4" class="star"/>
  <g><line class="edge" x1="60" y1="65" x2="140" y2="40" pathLength="1" style="animation-delay:0.35s"/><line class="edge faint" x1="60" y1="65" x2="220" y2="85" pathLength="1" style="animation-delay:0.60s"/><line class="edge" x1="140" y1="40" x2="220" y2="85" pathLength="1" style="animation-delay:0.60s"/><line class="edge faint" x1="140" y1="40" x2="300" y2="50" pathLength="1" style="animation-delay:0.85s"/><line class="edge" x1="220" y1="85" x2="300" y2="50" pathLength="1" style="animation-delay:0.85s"/><line class="edge faint" x1="220" y1="85" x2="380" y2="80" pathLength="1" style="animation-delay:1.10s"/><line class="edge" x1="300" y1="50" x2="380" y2="80" pathLength="1" style="animation-delay:1.10s"/><line class="edge" x1="820" y1="80" x2="900" y2="50" pathLength="1" style="animation-delay:0.35s"/><line class="edge faint" x1="820" y1="80" x2="980" y2="85" pathLength="1" style="animation-delay:0.60s"/><line class="edge" x1="900" y1="50" x2="980" y2="85" pathLength="1" style="animation-delay:0.60s"/><line class="edge faint" x1="900" y1="50" x2="1060" y2="40" pathLength="1" style="animation-delay:0.85s"/><line class="edge" x1="980" y1="85" x2="1060" y2="40" pathLength="1" style="animation-delay:0.85s"/><line class="edge faint" x1="980" y1="85" x2="1140" y2="65" pathLength="1" style="animation-delay:1.10s"/><line class="edge" x1="1060" y1="40" x2="1140" y2="65" pathLength="1" style="animation-delay:1.10s"/></g><g><g class="node" style="animation-delay:0.20s;transform-origin:60px 65px"><circle cx="60" cy="65" r="9" class="halo"/><circle cx="60" cy="65" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.45s;transform-origin:140px 40px"><circle cx="140" cy="40" r="9" class="halo"/><circle cx="140" cy="40" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.70s;transform-origin:220px 85px"><circle cx="220" cy="85" r="9" class="halo"/><circle cx="220" cy="85" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.95s;transform-origin:300px 50px"><circle cx="300" cy="50" r="9" class="halo"/><circle cx="300" cy="50" r="4.5" class="core"/></g><g class="node" style="animation-delay:1.20s;transform-origin:380px 80px"><circle cx="380" cy="80" r="9" class="halo"/><circle cx="380" cy="80" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.20s;transform-origin:820px 80px"><circle cx="820" cy="80" r="9" class="halo"/><circle cx="820" cy="80" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.45s;transform-origin:900px 50px"><circle cx="900" cy="50" r="9" class="halo"/><circle cx="900" cy="50" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.70s;transform-origin:980px 85px"><circle cx="980" cy="85" r="9" class="halo"/><circle cx="980" cy="85" r="4.5" class="core"/></g><g class="node" style="animation-delay:0.95s;transform-origin:1060px 40px"><circle cx="1060" cy="40" r="9" class="halo"/><circle cx="1060" cy="40" r="4.5" class="core"/></g><g class="node" style="animation-delay:1.20s;transform-origin:1140px 65px"><circle cx="1140" cy="65" r="9" class="halo"/><circle cx="1140" cy="65" r="4.5" class="core"/></g></g><g><circle r="3" class="pulse" opacity="0"><animateMotion path="M60,65 L140,40 L220,85 L300,50 L380,80" dur="2.4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="2.2s" repeatCount="indefinite"/></circle><circle r="3" class="pulse" opacity="0"><animateMotion path="M1140,65 L1060,40 L980,85 L900,50 L820,80" dur="2.4s" begin="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="3.4s" repeatCount="indefinite"/></circle></g>
  <text x="600.0" y="72" text-anchor="middle" class="msg">Thanks for stopping by</text>
</svg>